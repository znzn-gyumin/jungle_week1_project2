<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>앨범 | Flowbee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/pages/album.css">
  <link rel="stylesheet" href="/css/pages/album-dynamic.css">
</head>
<body>
  <header class="album-nav"><a class="album-brand" href="/"><span>FB</span>Flowbee</a><a class="back-link" href="/">라이브러리로 돌아가기</a></header>
  <main id="album-page" aria-busy="true">
    <section class="album-status" id="album-status">앨범 정보를 불러오는 중입니다.</section>
    <section class="album-hero" id="album-content" hidden>
      <div class="album-cover"><img id="album-cover" alt=""><b>FLOWBEE<br>ALBUM</b></div>
      <div class="album-meta"><p id="album-type"></p><h1 id="album-title"></h1><h2><i>●</i> <span id="album-artist"></span></h2><strong id="album-description"></strong><small id="album-summary"></small></div>
      <em>BZZ<br><span id="album-number">01</span></em>
    </section>
    <section class="album-body" id="album-body" hidden>
      <div class="album-actions"><button class="play-control" id="album-play" aria-label="재생"></button><button class="action-icon">+</button><button class="action-icon album-like" aria-label="좋아요"></button><button class="action-icon more-button">...</button><span id="track-count"></span></div>
      <div class="track-head"><span>#</span><span>제목</span><span>좋아요</span><span>길이</span></div>
      <ol class="album-tracks" id="album-tracks"></ol>
    </section>
  </main>
  <footer class="album-player" id="album-player" hidden>
    <div class="player-track-info"><img id="player-cover" alt=""><div><b id="now-title">재생할 곡을 선택하세요</b><small id="now-artist"></small></div></div>
    <div class="player-center">
      <div class="player-buttons"><button id="player-prev" type="button" aria-label="이전 곡">⏮</button><button class="play-control" id="player-toggle" aria-label="재생"></button><button id="player-next" type="button" aria-label="다음 곡">⏭</button></div>
      <div class="player-progress"><time id="player-current">0:00</time><input id="player-seek" type="range" min="0" max="30" step="0.1" value="0" aria-label="재생 위치"><time id="player-duration">0:30</time></div>
    </div>
    <div class="player-volume"><span aria-hidden="true">🔊</span><input id="player-volume" type="range" min="0" max="1" step="0.05" value="0.7" aria-label="음량"></div>
  </footer>
  <audio id="audio-player" preload="metadata"></audio>
  <script src="/js/pages/album.js"></script>
</body>
</html>
