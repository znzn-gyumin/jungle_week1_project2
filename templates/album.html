<!DOCTYPE html>
<html lang="ko">
<head>
<!--#include head-->
  <title>앨범 | 플로비</title>
  <link rel="stylesheet" href="/css/pages/album.css">
  <link rel="stylesheet" href="/css/pages/album-dynamic.css">
  <link rel="stylesheet" href="/css/components/now-playing-drawer.css">
</head>
<body>
  <header class="album-nav"><a class="album-brand" href="/"><span class="dot-icon"><svg viewBox="0 0 40 40"><path d="M14,9 C13,5 11,3 9,2" stroke="#2A1B06" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="9" cy="2" r="1.8" fill="#2A1B06"/><path d="M26,9 C27,5 29,3 31,2" stroke="#2A1B06" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="31" cy="2" r="1.8" fill="#2A1B06"/><circle cx="20" cy="23" r="13" fill="#F4B942"/><ellipse cx="20" cy="25" rx="11" ry="3" fill="#2A1B06"/><ellipse cx="8" cy="14" rx="8" ry="9" fill="rgba(255,255,255,0.5)" transform="rotate(-20 8 14)"/><ellipse cx="32" cy="14" rx="8" ry="9" fill="rgba(255,255,255,0.5)" transform="rotate(20 32 14)"/><ellipse cx="8" cy="26" rx="5.5" ry="6.5" fill="rgba(255,255,255,0.5)" transform="rotate(-10 8 26)"/><ellipse cx="32" cy="26" rx="5.5" ry="6.5" fill="rgba(255,255,255,0.5)" transform="rotate(10 32 26)"/></svg></span>플로비</a><a class="back-link" href="/">라이브러리로 돌아가기</a></header>
  <main id="album-page" aria-busy="true">
    <section class="album-status" id="album-status">앨범 정보를 불러오는 중입니다.</section>
    <section class="album-hero" id="album-content" hidden>
      <div class="album-cover"><img id="album-cover" alt=""><b>FLOWBEE<br>ALBUM</b></div>
      <div class="album-meta"><p id="album-type"></p><h1 id="album-title"></h1><h2><i>●</i> <span id="album-artist"></span></h2><strong id="album-description"></strong><small id="album-summary"></small></div>
      <em>BZZ<br><span id="album-number">01</span></em>
    </section>
    <section class="album-body" id="album-body" hidden>
      <div class="album-actions"><button class="play-control" id="album-play" aria-label="재생"></button><button class="action-icon">+</button><button class="action-icon album-like" aria-label="좋아요"></button><button class="action-icon more-button">...</button><span id="track-count"></span></div>
      <div class="track-head"><span>#</span><span>제목</span><span>듣기</span><span>담기</span><span>길이</span></div>
      <ol class="album-tracks" id="album-tracks"></ol>
    </section>
  </main>
  <aside class="now-playing-drawer is-collapsed" id="now-playing-drawer"><button class="drawer-toggle" id="drawer-toggle" type="button" aria-label="현재 재생 패널 열기">‹</button><div class="drawer-content"><p class="drawer-label">NOW PLAYING · 30초 미리듣기</p><img class="drawer-cover" id="drawer-cover" alt=""><h2 class="drawer-title" id="drawer-title">재생 중인 곡이 없습니다</h2><p class="drawer-artist" id="drawer-artist"></p><div class="drawer-preview">플로비는 iTunes에서 제공하는 30초 미리듣기를 재생합니다.</div><h3 class="drawer-queue-title">다음 재생 목록</h3><div class="drawer-queue" id="drawer-queue"></div></div></aside>
  <footer class="album-player" id="album-player" hidden>
    <div class="player-track-info"><img id="player-cover" alt=""><div><b id="now-title">재생할 곡을 선택하세요</b><small id="now-artist"></small></div></div>
    <div class="player-center">
      <div class="player-buttons"><button id="player-prev" type="button" aria-label="이전 곡">⏮</button><button class="play-control" id="player-toggle" aria-label="재생"></button><button id="player-next" type="button" aria-label="다음 곡">⏭</button></div>
      <div class="player-progress"><time id="player-current">0:00</time><input id="player-seek" type="range" min="0" max="30" step="0.1" value="0" aria-label="재생 위치"><time id="player-duration">0:30</time></div>
    </div>
    <div class="player-volume"><span aria-hidden="true">🔊</span><input id="player-volume" type="range" min="0" max="1" step="0.05" value="0.7" aria-label="음량"></div>
  </footer>
  <audio id="audio-player" preload="metadata"></audio>
  <script defer src="/js/api.js"></script>
  <script defer src="/js/recommended-playlists.js"></script>
  <script defer src="/js/fixed-catalog.js"></script>
  <script defer src="/js/pages/detail-player.js"></script>
  <script defer src="/js/pages/album.js"></script>
</body>
</html>
