<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>추천 플레이리스트 | Flowbee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/pages/playlist.css">
  <link rel="stylesheet" href="/css/pages/album-dynamic.css">
  <link rel="stylesheet" href="/css/pages/playlist-dynamic.css">
</head>
<body>
  <header class="playlist-nav"><a class="playlist-brand" href="/"><span class="dot-icon"><svg viewBox="0 0 40 40"><path d="M14,9 C13,5 11,3 9,2" stroke="#2A1B06" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="9" cy="2" r="1.8" fill="#2A1B06"/><path d="M26,9 C27,5 29,3 31,2" stroke="#2A1B06" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="31" cy="2" r="1.8" fill="#2A1B06"/><circle cx="20" cy="23" r="13" fill="#F4B942"/><ellipse cx="20" cy="25" rx="11" ry="3" fill="#2A1B06"/><ellipse cx="8" cy="14" rx="8" ry="9" fill="rgba(255,255,255,0.5)" transform="rotate(-20 8 14)"/><ellipse cx="32" cy="14" rx="8" ry="9" fill="rgba(255,255,255,0.5)" transform="rotate(20 32 14)"/><ellipse cx="8" cy="26" rx="5.5" ry="6.5" fill="rgba(255,255,255,0.5)" transform="rotate(-10 8 26)"/><ellipse cx="32" cy="26" rx="5.5" ry="6.5" fill="rgba(255,255,255,0.5)" transform="rotate(10 32 26)"/></svg></span>Flowbee</a><a class="back-link" href="/">← 라이브러리로 돌아가기</a></header>
  <main id="playlist-page" aria-busy="true">
    <section class="playlist-status" id="playlist-status">15곡의 추천 음악을 고르는 중입니다.</section>
    <section class="playlist-hero" id="playlist-content" hidden>
      <div class="playlist-cover"><img id="playlist-cover" alt=""><b>FLOWBEE<br>CURATED</b></div>
      <div class="playlist-meta"><p>FLOWBEE RECOMMENDED</p><h1 id="playlist-title"></h1><h2 id="playlist-description"></h2><strong id="playlist-summary"></strong><div class="tags" id="playlist-tags"></div></div>
      <i>FLOW<br><span id="playlist-code">01</span></i>
    </section>
    <section class="playlist-body" id="playlist-body" hidden>
      <div class="playlist-actions"><button class="play-control" id="playlist-play" aria-label="전체 재생"></button><button class="action-icon add-button" aria-label="내 라이브러리에 추가">+</button><button class="action-icon playlist-like" aria-label="좋아요"></button><button class="action-icon more-button" id="more-button">...</button><span id="playlist-count"></span></div>
      <div class="track-head"><span>#</span><span>제목</span><span>앨범</span><span>좋아요</span><span>길이</span></div>
      <ol class="playlist-tracks" id="playlist-tracks"></ol>
    </section>
  </main>
  <footer class="album-player playlist-player" id="playlist-player" hidden>
    <div class="player-track-info"><img id="player-cover" alt=""><div><b id="now-title">재생할 곡을 선택하세요</b><small id="now-artist"></small></div></div>
    <div class="player-center"><div class="player-buttons"><button id="player-prev" type="button" aria-label="이전 곡">⏮</button><button class="play-control" id="player-toggle" aria-label="재생"></button><button id="player-next" type="button" aria-label="다음 곡">⏭</button></div><div class="player-progress"><time id="player-current">0:00</time><input id="player-seek" type="range" min="0" max="30" step="0.1" value="0"><time id="player-duration">0:30</time></div></div>
    <div class="player-volume"><span>🔊</span><input id="player-volume" type="range" min="0" max="1" step="0.05" value="0.7"></div>
  </footer>
  <audio id="audio-player" preload="metadata"></audio>
  <script src="/js/recommended-playlists.js"></script>
  <script src="/js/pages/playlist.js"></script>
</body>
</html>
