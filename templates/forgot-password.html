<!DOCTYPE html>
<html lang="ko">
<head>
<!--#include head-->
<title>플로비 | 비밀번호 재설정</title>
<link rel="stylesheet" href="/css/pages/login.css">
</head>
<body>

<div class="login-page">

    <a href="/" class="login-logo">
        <svg viewBox="0 0 40 40">
            <path d="M14,9 C13,5 11,3 9,2" stroke="#2A1B06" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            <circle cx="9" cy="2" r="1.8" fill="#2A1B06"/>
            <path d="M26,9 C27,5 29,3 31,2" stroke="#2A1B06" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            <circle cx="31" cy="2" r="1.8" fill="#2A1B06"/>
            <circle cx="20" cy="23" r="13" fill="#F4B942"/>
            <ellipse cx="20" cy="25" rx="11" ry="3" fill="#2A1B06"/>
            <ellipse cx="8" cy="14" rx="8" ry="9" fill="rgba(255,255,255,0.5)" transform="rotate(-20 8 14)"/>
            <ellipse cx="32" cy="14" rx="8" ry="9" fill="rgba(255,255,255,0.5)" transform="rotate(20 32 14)"/>
            <ellipse cx="8" cy="26" rx="5.5" ry="6.5" fill="rgba(255,255,255,0.5)" transform="rotate(-10 8 26)"/>
            <ellipse cx="32" cy="26" rx="5.5" ry="6.5" fill="rgba(255,255,255,0.5)" transform="rotate(10 32 26)"/>
        </svg>
        플로비
    </a>

    <div class="login-card">
        <div id="request-view">
            <h1 class="login-title">비밀번호를 잊으셨나요?</h1>
            <p class="login-sub">가입하신 이메일을 입력하시면 재설정 링크를 보내드려요</p>

            <form class="login-form" id="forgot-form">
                <label class="login-label" for="email">이메일</label>
                <input class="login-input" type="email" id="email" name="email" placeholder="you@example.com" required>

                <p class="login-error" id="forgot-error" hidden></p>

                <button type="submit" class="btn btn-primary login-submit">재설정 링크 보내기</button>
            </form>
        </div>

        <div id="sent-view" hidden>
            <h1 class="login-title">이메일을 확인해주세요</h1>
            <p class="login-sub" id="sent-message">입력하신 주소로 재설정 링크를 보냈어요.</p>
            <button type="button" class="btn btn-outline login-submit" id="resend-btn">다시 보내기</button>
        </div>

        <p class="login-footer">
            비밀번호가 기억나셨나요? <a href="/login" class="login-link">로그인으로 돌아가기</a>
        </p>
    </div>

</div>

<script src="/js/pages/forgot-password.js"></script>
</body>
</html>
