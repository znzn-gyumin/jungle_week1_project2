<!DOCTYPE html>
<html lang="ko">
<head>
<!--#include head-->
<title>플로비 | 홈</title>
<link rel="stylesheet" href="/css/pages/main.css">
<link rel="stylesheet" href="/css/pages/main-dynamic.css">
<link rel="stylesheet" href="/css/components/now-playing-drawer.css">
</head>
<body>

<div class="app-shell">

<!--#include sidebar-->

    <div class="main-col">

<!--#include topbar-->

        <nav class="content-tabs">
<!--#include tabs-->
            <a class="week-pick" href="#" id="week-pick-play">
                <span class="week-pick-text">이번 주 추천 · <strong>Daybreak</strong></span>
                <svg class="week-pick-decor" viewBox="0 0 70 40" aria-hidden="true">
                    <defs>
                        <linearGradient id="tapeGradMini" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#E8A33D"/>
                            <stop offset="1" stop-color="#8A5A2B"/>
                        </linearGradient>
                    </defs>
                    <rect x="4" y="6" width="42" height="28" rx="6" fill="url(#tapeGradMini)"/>
                    <rect x="10" y="13" width="30" height="10" rx="3" fill="rgba(0,0,0,0.4)"/>
                    <circle cx="16" cy="27" r="4" fill="none" stroke="#fff" stroke-width="1.6"/>
                    <circle cx="34" cy="27" r="4" fill="none" stroke="#fff" stroke-width="1.6"/>
                    <g transform="translate(42,0) scale(0.55)">
                        <path d="M14,9 C13,5 11,3 9,2" stroke="#2A1B06" stroke-width="1.6" stroke-linecap="round" fill="none"/>
                        <circle cx="9" cy="2" r="1.8" fill="#2A1B06"/>
                        <path d="M26,9 C27,5 29,3 31,2" stroke="#2A1B06" stroke-width="1.6" stroke-linecap="round" fill="none"/>
                        <circle cx="31" cy="2" r="1.8" fill="#2A1B06"/>
                        <circle cx="20" cy="23" r="13" fill="#F4B942"/>
                        <ellipse cx="20" cy="25" rx="11" ry="3" fill="#2A1B06"/>
                        <ellipse cx="8" cy="14" rx="8" ry="9" fill="rgba(255,255,255,0.5)" transform="rotate(-20 8 14)"/>
                        <ellipse cx="32" cy="14" rx="8" ry="9" fill="rgba(255,255,255,0.5)" transform="rotate(20 32 14)"/>
                        <ellipse cx="8" cy="26" rx="5.5" ry="6.5" fill="rgba(255,255,255,0.5)" transform="rotate(-10 8 26)"/>
                        <ellipse cx="32" cy="26" rx="5.5" ry="6.5" fill="rgba(255,255,255,0.5)" transform="rotate(10 32 26)"/>
                    </g>
                </svg>
            </a>
        </nav>

        <main class="main-content">

            <section class="section" id="search-results" hidden>
                <div class="section-head">
                <h2 class="section-title">'<span id="search-query-text"></span>' 검색 결과</h2>
                <button type="button" class="search-clear-btn" id="search-clear-btn">✕ 검색 지우기</button>
                </div>
                <h3 class="search-subheading">앨범</h3>
                <div class="card-grid" id="search-albums-grid"></div>
                <h3 class="search-subheading">곡</h3>
                <div class="chart-head">
                    <span>순위</span>
                    <span></span>
                    <span>곡정보</span>
                    <span>앨범</span>
                    <span>듣기</span>
                    <span>담기</span>
                </div>
                <div class="chart-list" id="search-tracks-list"></div>
            </section>

            <section class="section">
                <div class="section-head">
                <h2 class="section-title">
                    최근 재생
<!--#include bee-->
                </h2>
                </div>
                <div class="card-grid" data-album-grid data-query="Red Velvet"></div>
            </section>

            <section class="section">
                <div class="section-head">
                <h2 class="section-title">최신 발매</h2>
                </div>
                <div class="card-grid" data-album-grid data-fixed-latest="true" data-query="K-pop"></div>
            </section>

            <section class="section">
                <div class="section-head">
                <h2 class="section-title">인기 앨범</h2>
                </div>
                <div class="card-grid" data-album-grid data-query="Taylor Swift"></div>
            </section>

            <section class="section">
                <div class="section-head">
                <h2 class="section-title">내 플레이리스트</h2>
                </div>
                <div class="card-grid" id="my-playlists-grid"></div>
            </section>

            <section class="section">
                <div class="section-head">
                <h2 class="section-title">추천 플레이리스트</h2>
                <button class="playlist-reroll" id="playlist-reroll" type="button" aria-label="추천 플레이리스트 새로 만들기">↻ 새 추천</button>
                </div>
                <div class="card-grid" data-playlist-grid></div>
            </section>

        </main>
    </div>
</div>

<aside class="now-playing-drawer is-collapsed" id="now-playing-drawer">
    <button class="drawer-close" id="drawer-close" type="button" aria-label="현재 재생 패널 닫기">✕</button>
    <div class="drawer-content">
        <p class="drawer-label">NOW PLAYING</p>
        <div class="drawer-empty-cover" id="drawer-empty-cover" aria-hidden="true">♪</div>
        <img class="drawer-cover" id="drawer-cover" alt="" hidden>
        <h2 class="drawer-title" id="drawer-title">재생 중인 곡이 없습니다</h2>
        <p class="drawer-artist" id="drawer-artist">앨범이나 곡을 선택해 주세요.</p>
        <div class="drawer-preview">플로비는 iTunes에서 제공하는 30초 미리듣기를 재생합니다.</div>
        <h3 class="drawer-queue-title">다음 재생 목록</h3>
        <div class="drawer-queue" id="drawer-queue"><p class="drawer-empty-message">재생을 시작하면 다음 곡이 여기에 표시됩니다.</p></div>
    </div>
</aside>

<!--#include player-->

<script defer src="/js/api.js"></script>
<script defer src="/js/recommended-playlists.js"></script>
<script defer src="/js/fixed-catalog.js"></script>
<script defer src="/js/pages/main.js"></script>
</body>
</html>
