<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 앨범 표지는 전부 이 호스트에서 온다. 첫 이미지 요청 전에 DNS+TLS 를 미리 열어 둔다.
     표지는 대부분 일반 <img>/background-image 라 crossorigin 을 붙이면 안 된다.
     붙이면 CORS 전용 커넥션이 열려서 정작 쓰는 커넥션은 그대로 새로 맺는다. -->
<link rel="preconnect" href="https://is1-ssl.mzstatic.com">
<!-- 공개 카탈로그 API 직결 호스트. 여기로 가는 요청은 교차 출처 fetch(CORS 모드)라
     위 표지 호스트와 달리 crossorigin 이 있어야 실제로 쓰이는 커넥션이 데워진다.
     이게 없으면 JS 가 첫 fetch 를 할 때 TLS 를 새로 맺느라 직결 이득이 상쇄된다. -->
<link rel="preconnect" href="https://api.flowbee.nari3040.dev" crossorigin>
<!-- 나머지 스크립트보다 먼저 실행돼야 한다 (defer 는 문서 순서를 지킨다). -->
<script defer src="/js/config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
