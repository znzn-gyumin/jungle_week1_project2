<footer class="player-bar">
    <div class="player-now-playing">
        <div class="track-thumb sm" style="background:linear-gradient(135deg,#E8A33D,#8A5A2B);"></div>
        <div>
            <div class="track-name">재생할 곡을 선택하세요</div>
            <div class="track-sub"></div>
        </div>
    </div>
    <div class="player-controls">
        <div class="player-buttons">
            <button class="ctrl-btn" type="button">⏮</button>
            <button class="ctrl-btn play" type="button" id="play-btn"><span>▶</span></button>
            <button class="ctrl-btn" type="button">⏭</button>
        </div>
        <div class="player-progress">
            <span class="time">0:00</span>
            <div class="progress-track"><div class="progress-fill" style="width:0%;"></div></div>
            <span class="time">0:00</span>
        </div>
    </div>
    <div class="player-volume">
        <span class="icon">🔊</span>
        <input type="range" class="volume-slider" id="site-volume" min="0" max="1" step="0.05" value="0.7" aria-label="음량">
    </div>
</footer>
