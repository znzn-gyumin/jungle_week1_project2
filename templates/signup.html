<!DOCTYPE html>
<html lang="ko">
<head>
<!--#include head-->
<title>플로비 | 회원가입</title>
<link rel="stylesheet" href="/css/pages/login.css">
<link rel="stylesheet" href="/css/pages/signup.css">
</head>
<body>

<div class="login-page">

    <a href="/" class="login-logo">
        <svg viewBox="0 0 40 40">
            <path d="M14,9 C13,5 11,3 9,2" stroke="#2A1B06" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            <circle cx="9" cy="2" r="1.8" fill="#2A1B06"/>
            <path d="M26,9 C27,5 29,3 31,2" stroke="#2A1B06" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            <circle cx="31" cy="2" r="1.8" fill="#2A1B06"/>
            <circle cx="20" cy="23" r="13" fill="#F4B942"/>
            <ellipse cx="20" cy="25" rx="11" ry="3" fill="#2A1B06"/>
            <ellipse cx="8" cy="14" rx="8" ry="9" fill="rgba(255,255,255,0.5)" transform="rotate(-20 8 14)"/>
            <ellipse cx="32" cy="14" rx="8" ry="9" fill="rgba(255,255,255,0.5)" transform="rotate(20 32 14)"/>
            <ellipse cx="8" cy="26" rx="5.5" ry="6.5" fill="rgba(255,255,255,0.5)" transform="rotate(-10 8 26)"/>
            <ellipse cx="32" cy="26" rx="5.5" ry="6.5" fill="rgba(255,255,255,0.5)" transform="rotate(10 32 26)"/>
        </svg>
        플로비
    </a>

    <div class="login-card">
        <h1 class="login-title">플로비, 처음이시군요</h1>
        <p class="login-sub">계정을 만들고 음악을 한 곳에서 즐겨보세요</p>

        <form class="login-form" id="signup-form">
            <label class="login-label" for="nickname">닉네임</label>
            <input class="login-input" type="text" id="nickname" name="nickname" placeholder="사용하실 닉네임" required>

            <label class="login-label" for="email">이메일</label>
            <input class="login-input" type="email" id="email" name="email" placeholder="you@example.com" required>

            <label class="login-label" for="password">비밀번호</label>
            <input class="login-input" type="password" id="password" name="password" placeholder="8자 이상 입력해주세요" minlength="8" required>

            <label class="login-label" for="password2">비밀번호 확인</label>
            <input class="login-input" type="password" id="password2" name="password2" placeholder="비밀번호를 다시 입력해주세요" minlength="8" required>

            <label class="login-check signup-terms">
                <input type="checkbox" name="agree" id="agree" required>
                <span>(필수) 이용약관 및 개인정보 처리방침에 동의합니다</span>
            </label>

            <p class="login-error" id="signup-error" hidden></p>

            <button type="submit" class="btn btn-primary login-submit">회원가입</button>
        </form>

        <div class="login-divider" id="google-divider"><span>또는</span></div>

        <!-- 구글 버튼은 google-signin.js 가 Google Identity Services 로 여기에 그린다.
             클라이언트 ID 가 없으면 위 구분선·아래 약관 문구와 함께 통째로 사라진다.
             구글로 들어오면 위 폼의 약관 체크박스를 지나치므로 여기서 따로 알린다. -->
        <div class="login-social" id="google-btn"></div>
        <p class="signup-social-terms" id="google-terms">구글로 계속하면 이용약관 및 개인정보 처리방침에 동의하는 것으로 봅니다.</p>

        <p class="login-footer">
            이미 계정이 있으신가요? <a href="/login" class="login-link">로그인</a>
        </p>
    </div>

</div>

<script src="/js/google-signin.js"></script>
<script src="/js/pages/signup.js"></script>
</body>
</html>
